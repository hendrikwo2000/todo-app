<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Verwaltung · ToDo-Liste</title>
  <link rel="icon" href="icon-192.png">
  <meta name="theme-color" content="#f2f2f7">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="style.css">
</head>
<body class="verwaltung">
  <div class="app">
    <!-- Seit 18.11.2026 im iOS-Look wie die App: Zurueck oben links, grosser
         Titel darunter, Listen als weisse Gruppen. -->
    <header class="topbar">
      <a href="/" class="zurueck-knopf"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg>Zur Liste</a>
      <h1>Verwaltung</h1>
    </header>

    <!-- Nur ein Hinweis. Die eigentliche Sperre sitzt im Server: /api/admin/*
         antwortet ohne Adminrechte mit 404, egal was hier angezeigt wird. -->
    <div id="kseinZugang" class="admin-hinweis" hidden>
      <p>Kein Zugriff. Melde dich mit einem Konto an, das Adminrechte hat.</p>
      <a href="/" class="btn">Zur Anmeldung</a>
    </div>

    <div id="inhalt" hidden>
      <section class="admin-block">
        <h2>Offene Anfragen <span id="offenZahl" class="zahl">0</span></h2>
        <div id="offen" class="admin-liste"></div>
      </section>

      <section class="admin-block">
        <h2>Nutzer <span id="nutzerZahl" class="zahl">0</span></h2>
        <div id="nutzer" class="admin-liste"></div>
      </section>
    </div>
  </div>

  <div id="snackbar" class="snackbar" aria-live="polite"></div>
  <!-- konto.js zuerst: mit mehreren Konten im Browser fragt das Dashboard
       als das Konto des Tabs, aus dem es geoeffnet wurde. -->
  <script src="konto.js"></script>
  <script src="admin.js"></script>
</body>
</html>
